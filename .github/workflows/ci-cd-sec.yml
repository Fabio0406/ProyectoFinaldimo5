name: CI/CD - Spring Boot DevSecOps

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  IMAGE_NAME: springboot-devsecops-lab

jobs:
  # ==================================================================
  # CI JOBS
  # ==================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build & test with coverage
        run: mvn -B clean verify

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/*.jar
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

  sast-codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  sca-trivy:
    name: SCA - Trivy (dependencias)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy on project dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: trivy-sca-report.json
          exit-code: '0'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sca-report
          path: trivy-sca-report.json
          if-no-files-found: warn
          retention-days: 14

  policy-conftest:
    name: Policy as Code - Conftest (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Conftest on Dockerfile
        run: |
          docker run --rm -v "$PWD:/project" -w /project openpolicyagent/conftest \
            test Dockerfile --policy policy --output json > conftest-report.json || true
          cat conftest-report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conftest-report
          path: conftest-report.json
          if-no-files-found: warn
          retention-days: 14

  # ==================================================================
  # CD JOBS – build & scan de la imagen del proyecto; en main/develop
  # se entrega como artifact para el despliegue local (deploy-local.ps1)
  # ==================================================================
  docker-build-scan:
    name: Docker Build → Scan
    runs-on: ubuntu-latest
    needs: [build-and-test, sast-codeql]   # wait for CI quality gates
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: docker build -t "$IMAGE_NAME:$IMAGE_TAG" .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: json
          output: trivy-image-report.json
          exit-code: '0'                 # no bloquea: el objetivo es evidenciar los hallazgos

      - name: Upload Trivy image report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-report
          path: trivy-image-report.json
          if-no-files-found: warn
          retention-days: 14

      # La imagen escaneada es la misma que se despliega en el entorno local.
      - name: Export image for local deployment
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'develop')
        run: docker save "$IMAGE_NAME:$IMAGE_TAG" | gzip > "$IMAGE_NAME.tar.gz"

      - name: Upload image artifact
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'develop')
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ env.IMAGE_NAME }}.tar.gz
          compression-level: 0
          retention-days: 7
